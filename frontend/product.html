<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Electronics Square">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESCRIPTION__">
<meta property="og:image" content="__OG_IMAGE__">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/product.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="/" class="brand">
      <img src="/assets/logo.png" alt="Electronics Square logo" class="brand-logo">
      <span class="brand-name">Electronics<span class="brand-name-accent">Square</span></span>
    </a>

    <nav class="main-nav">
      <a href="/#shop">Shop</a>
      <a href="/#categories">Categories</a>
      <a href="/#contact">Contact</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn cart-btn" id="cartToggle" aria-label="Open cart">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6h15l-1.5 9h-12L6 6zm0 0L5 3H2m5 15a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm11 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap pd-wrap" id="productRoot">
  <p class="pd-loading">Loading product…</p>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <a href="/" class="brand brand-footer">
      <img src="/assets/logo.png" alt="Electronics Square logo" class="brand-logo">
      <span class="brand-name">Electronics<span class="brand-name-accent">Square</span></span>
    </a>
    <p class="footer-copy">© <span id="year"></span> Electronics Square. All rights reserved.</p>
    <div class="footer-links">
      <a href="/#shop">Shop</a>
      <a href="/#contact">Contact</a>
    </div>
  </div>
</footer>

<!-- Full-screen photo viewer -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close photo viewer">×</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">›</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script src="/common.js"></script>
<script src="/cart.js"></script>
<script src="/product.js"></script>
</body>
</html>
